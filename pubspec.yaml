name: umbraro
description: UmbraRo tactical assistant app scaffold.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  web_socket_channel: ^2.4.0
  file_picker: ^8.0.0
  flutter_secure_storage: ^9.2.4
  logger: ^2.4.0
  cached_network_image: ^3.4.1
  # AWS Cognito email/password auth with emailed 6-digit confirmation (web +
  # mobile). Guarded at runtime: unused when no Cognito pool is configured.
  amplify_flutter: ^2.6.1
  amplify_auth_cognito: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_icon.png
    - assets/branding/logo_full.png
    - assets/branding/umbraro_wordmark.png
    - assets/teams/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Epilogue.ttf

# Native Android launcher icon (adaptive) generated from the brand mark on the
# Stoic Analyst surface. Dev-only tooling; does not affect the web bundle.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/logo_icon.png"
  adaptive_icon_background: "#0A1929"
  adaptive_icon_foreground: "assets/branding/logo_icon.png"

# Native Android splash on the #0A1929 surface (Android 12+ included).
flutter_native_splash:
  color: "#0A1929"
  image: assets/branding/logo_icon.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#0A1929"
    image: assets/branding/logo_icon.png
