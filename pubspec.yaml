name: umbraro
description: UmbraRo tactical assistant app scaffold.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  web_socket_channel: ^2.4.0
  file_picker: ^8.0.0
  flutter_secure_storage: ^9.2.4
  logger: ^2.4.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_icon.png
    - assets/branding/logo_full.png
    - assets/branding/umbraro_wordmark.png
    - assets/teams/
