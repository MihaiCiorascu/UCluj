# SAM CLI config for the UmbraRo infra stack.
#
# Fill the parameter_overrides (especially JwtSecret) before deploying, or pass
# them on the command line. JwtSecret is NoEcho; prefer passing it inline so it
# never lands in a committed file:
#
#   sam deploy --parameter-overrides "JwtSecret=<the-app-runner-JWT_SECRET>"
#
version = 0.1

[default.global.parameters]
stack_name = "umbraro-infra"
region = "eu-central-1"

[default.build.parameters]
# `sam build` vendors each Lambda's requirements.txt (PyJWT for ws_connect).
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
region = "eu-central-1"
# JwtSecret intentionally omitted here; pass it on the CLI so the secret is not
# stored on disk. Other parameters fall back to their template defaults
# (AvatarsBucketName=ucluj-user-avatars, CreateAvatarsBucket=true, etc.).
# parameter_overrides = "JwtSecret=REPLACE_ME"
